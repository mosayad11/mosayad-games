<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mosayad Games</title>

    <link rel="icon" href="images/logo.png">

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <!--========== LOADING SCREEN ==========-->

    <div id="loader">

        <div class="spinner"></div>

        <h2>Loading...</h2>

    </div>

    <!--========== HEADER ==========-->

    <header>

        <div class="logo">

            <img src="images/logo.png" alt="Logo">

            <h1>Mosayad Games</h1>

        </div>

        <nav id="nav">

            <a href="#">Home</a>

            <a href="#">Games</a>

            <a href="#">About</a>

            <a href="#">Contact</a>

        </nav>

        <div class="header-buttons">

            <button id="sound-btn" title="Sound">

                🔊

            </button>

            <button id="theme-btn" title="Theme">

                🌙

            </button>

            <button id="menu-btn">

                ☰

            </button>

        </div>

    </header>

    <!--========== HERO ==========-->

    <section class="hero">

        <div class="hero-content">

            <h2>

                Download Free Python Games

            </h2>

            <p>

                Download complete Python games including the executable,
                source code, assets, and save files.

            </p>

        </div>

    </section>

    <!--========== SEARCH ==========-->

    <section class="search">

        <input
            id="search"
            type="text"
            placeholder="Search games..."
        >

    </section>

    <!--========== GAMES ==========-->

    <main>

        <div id="games-container">

            <!-- JavaScript -->

        </div>

    </main>

    <!--========== BACK TO TOP ==========-->

    <button id="top-btn">

        ↑

    </button>

    <!--========== FOOTER ==========-->

    <footer>

        <p>

            © 2026 Mosayad Games

        </p>

    </footer>

    <!--========== AUDIO ==========-->

    <audio id="click-sound" preload="auto">

        <source src="sounds/click.mp3" type="audio/mpeg">

    </audio>

    <audio id="hover-sound" preload="auto">

        <source src="sounds/hover.mp3" type="audio/mpeg">

    </audio>

    <script src="js/app.js"></script>

</body>

</html>
