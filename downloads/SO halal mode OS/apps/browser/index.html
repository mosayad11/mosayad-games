<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Browser</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <div class="browser">

        <div class="toolbar">

            <button id="back">
                ←
            </button>

            <button id="forward">
                →
            </button>

            <input
                id="address"
                placeholder="Search Google or enter URL"
            >

            <button id="go">
                Go
            </button>

        </div>


        <div class="home">

            <div class="globe">
                🌐
            </div>

            <h1>
                Browser
            </h1>

            <p>
                Search the web or open a website.
            </p>


            <div class="quick-links">
<!-- 
                <button data-url="https://www.google.com">
                    Google
                </button>

                <button data-url="https://www.youtube.com">
                    YouTube
                </button> -->

                <button data-url="https://battut.app/">
                    Open "Battut" Islamic Social Media
                </button>

            </div>

        </div>

    </div>


    <script src="app.js"></script>

</body>

</html>
