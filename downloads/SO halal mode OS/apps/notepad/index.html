<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Notepad</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <div class="toolbar">

        <button id="new-button">
            New
        </button>

        <button id="save-button">
            Save
        </button>

        <button id="clear-button">
            Clear
        </button>

        <span id="status">
            Ready
        </span>

    </div>


    <textarea
        id="editor"
        placeholder="Start typing..."
    ></textarea>


    <script src="app.js"></script>

</body>

</html>
