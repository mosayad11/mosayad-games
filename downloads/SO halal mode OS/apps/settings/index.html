<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Settings</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <div class="settings">

        <h1>Settings</h1>

        <p class="subtitle">
            Customize your SO Halal Mode OS experience.
        </p>


        <section class="settings-section">

            <h2>Appearance</h2>

            <button
                class="setting"
                id="dark-mode"
            >

                <span class="setting-icon">
                    🌙
                </span>

                <span class="setting-info">

                    <strong>
                        Dark Mode
                    </strong>

                    <small>
                        Use the dark appearance.
                    </small>

                </span>

                <span
                    class="toggle"
                    id="dark-toggle"
                ></span>

            </button>

        </section>


        <section class="settings-section">

            <h2>System</h2>

            <button
                class="setting"
                id="sound"
            >

                <span class="setting-icon">
                    🔊
                </span>

                <span class="setting-info">

                    <strong>
                        Sound
                    </strong>

                    <small>
                        Enable system sounds.
                    </small>

                </span>

                <span
                    class="toggle"
                    id="sound-toggle"
                ></span>

            </button>

        </section>

    </div>


    <script src="app.js"></script>

</body>

</html>
